    const novaActivePageKey = 'nova.activePageClient';
    let thisPageOwnsNova = true;

      }
    }
    function isPageOwner() {

      if (!item.id) return true;
      if (item.id === novaClientId) return true;
      return Date.now() - Number(item.time || 0) > 45000;

    function renderMessage(value, kind) {
      let raw = String(value);
      let mediaHtml = '';

      raw = raw.replace(/\[NOVA_IMAGE_URL\](.*?)\[\/NOVA_IMAGE_URL\]/g, (m, url) => {
        mediaHtml += `<div style="margin:12px 0;position:relative;">
          <img src="${url}" style="max-width:100%;border-radius:12px;cursor:pointer;" onclick="window.open('${url}','_blank')">
          <div style="margin-top:8px;display:flex;gap:8px;">
            <button onclick="window.open('${url}','_blank')" style="padding:6px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;">Download</button>
            <button onclick="this.closest('.msg').remove()" style="padding:6px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--red);cursor:pointer;font-size:13px;">Delete</button>
          </div>
        </div>`;
        return '';
      });

      raw = raw.replace(/\[NOVA_IMAGE\](.*?)\[\/NOVA_IMAGE\]/g, (m, filePath) => {
        const apiUrl = '/api/file?path=' + encodeURIComponent(filePath);
        mediaHtml += `<div style="margin:12px 0;position:relative;">
          <img src="${apiUrl}" style="max-width:100%;border-radius:12px;cursor:pointer;" onclick="window.open('${apiUrl}','_blank')">
          <div style="margin-top:8px;display:flex;gap:8px;">
            <button onclick="window.open('${apiUrl}','_blank')" style="padding:6px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;">Download</button>
            <button onclick="this.closest('.msg').remove()" style="padding:6px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--red);cursor:pointer;font-size:13px;">Delete</button>
          </div>
        </div>`;
        return '';
      });

      const parts = raw.split(/```([\s\S]*?)```/g);
      const textHtml = parts.map((part, index) => {
        if (index % 2 === 1) {
          const code = part.replace(/^[a-zA-Z0-9_+-]+\n/, '');
          return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
        }
        let t = escapeHtml(part);
        t = t.replace(/([A-Z]:\\[^\s<"']+\.(?:png|jpe?g|gif|webp))/gi, (match, p1) => {
           const u = '/api/file?path=' + encodeURIComponent(p1);
           return `<br><img src="${u}" style="max-width:100%;border-radius:12px;margin-top:10px;cursor:pointer;" onclick="window.open('${u}','_blank')">`;
        });
        t = t.replace(/([A-Z]:\\[^\s<"']+\.(?:mp4|webm))/gi, (match, p1) => {
           const u = '/api/file?path=' + encodeURIComponent(p1);
           return `<br><video src="${u}" controls style="max-width:100%;border-radius:12px;margin-top:10px;"></video>`;
        });
        return t;
      }).join('');

      return mediaHtml + textHtml;
    }

    function formatReaderTime(value) {

    function updateReader() {
      const duration = Number.isFinite(readerAudio.duration) ? readerAudio.duration : 0;
      const current = Number.isFinite(readerAudio.currentTime) ? readerAudio.currentTime : 0;
      readerProgress.max = Math.max(0, duration);
      readerProgress.value = Math.min(current, Math.max(0, duration));
      readerTime.textContent = `${formatReaderTime(current)} / ${formatReaderTime(duration)}`;
      readerPlay.textContent = readerActive && !readerPaused ? '\u275A\u275A' : '\u25B6';
      const hasAudio = Boolean(readerAudioUrl);

    async function prepareReaderAudio(value) {

      readerAudioUrl = '';
      try { readerAudio.pause(); } catch (e) {}
      try { readerAudio.removeAttribute('src'); readerAudio.load(); } catch (e) {}
      updateReader();
      const preparationPlaybackId = beginSpeechPlayback();
      subEl.textContent = 'Preparing local seekable voice...';
      try {
        await fetch('/api/stop_speech', {method: 'POST', headers: authHeaders()});
        const res = await fetch('/api/reader_audio', {
          method: 'POST',
          headers: authHeaders({'Content-Type': 'application/json'}),
          body: JSON.stringify({text: readerText})
        });
        const data = await res.json().catch(() => ({ok: res.ok}));
        if (!res.ok || data.ok === false || !data.url) throw new Error(data.error || 'Reader audio generation failed');
        if (runId !== readerRunId || readerManualStop) return;
        readerAudioUrl = data.url;
        readerAudio.src = readerAudioUrl;
        readerAudio.load();
        subEl.textContent = 'Reader audio ready.';
        await playReaderAudio();
      } catch (e) {
        if (runId !== readerRunId || readerManualStop) return;
        readerAudioUrl = '';

        finishSpeechPlayback(preparationPlaybackId);

    async function playReaderAudio() {

      readerPaused = false;
      readerPlaybackId = beginSpeechPlayback();
      updateReader();
      subEl.textContent = 'Reading selected answer...';
      try {
        await readerAudio.play();
      } catch (e) {
        if (readerManualStop) return;
        readerActive = false;
        readerPaused = true;

    function moveReader(seconds) {

    async function send(command, fromVoice = false) {
      command = (command || '').trim();
      if (!command) return;
      if (fromVoice && !isPageOwner()) {
        silenceThisStalePage();
        return;
      }
      if (!fromVoice) claimPageOwner('send');
      if (fromVoice && /^(stop voice|stop mic|stop listening|mic off|voice off|band mic|mic band|voice band|sunna band|listening band)$/i.test(command)) {
        stopAllMic();
        add('you', command);
        add('nova', 'Voice stopped. Click Start Voice again when you want me to listen.');
        promptEl.textContent = 'Voice stopped.';
        subEl.textContent = 'Mic is OFF by your command.';
        return;
      }
      if (sendBusy) {
        subEl.textContent = 'Still working on the previous command.';
        return;
      }
      sendBusy = true;
      sendButton.disabled = true;
      if (fromVoice) {
        voiceBusy = true;
        try { recognition.stop(); } catch (e) {}
        subEl.textContent = `Heard: ${command}`;
      }
      add('you', command);
      promptEl.textContent = 'Working on it...';
      statusEl.textContent = 'Thinking';
      if (/\b(wifi|wi-fi|wi fi|bluetooth|blue tooth)\b/i.test(command) && /\b(on|off|enable|disable|turn on|turn off|switch on|switch off)\b/i.test(command)) {
        subEl.textContent = 'Windows permission popup may appear. Press Yes to allow Nova, then I will verify the result.';
      }
      try {
        const res = await fetch('/api/command', {
          method: 'POST',
          headers: authHeaders({'Content-Type': 'application/json'}),
          body: JSON.stringify({
            command,
            planMode: Boolean(planModeToggle.checked),
            pursueGoal: Boolean(pursueGoalToggle.checked)
          })
        });
        const data = await res.json();
        if (res.status === 403) {
          setLocked(true);
          throw new Error(data.reply || 'Locked');
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const reply = data.reply || 'Nova did not return a reply.';
        if (data.duplicate) {
          promptEl.textContent = 'Duplicate ignored.';
          subEl.textContent = 'The same command was already received. Nova ran it only once.';
          statusEl.textContent = 'Ready';
          return;
        }
        add('nova', reply, command);
        promptEl.textContent = reply.length > 62 ? 'Done.' : reply;
        if (data.needsConfirm) {
          subEl.textContent = 'Permission needed on screen.';
          showPermissionPopup(reply, data.confirmCommand);
        } else if (data.needsPermission) {
          subEl.textContent = 'Permission or setting needed.';
          showPermissionPopup(reply, '');
        } else {
          subEl.textContent = 'Say another command.';
        }
        if (/Assistant is ON/i.test(reply)) setPowerState(true);
        if (/Assistant is OFF/i.test(reply)) setPowerState(false);
        statusEl.textContent = 'Ready';
        const shouldSpeakReply = fromVoice || document.body.classList.contains('voice-page');
        const replyAlreadySpeaking = /^Reading the last assistant answer/i.test(reply);
        if (shouldSpeakReply && !replyAlreadySpeaking) {
          if (reply.length < 360 && !reply.includes('```')) await backendSpeak(reply);
          else await backendSpeak('I wrote the full answer in chat. Use the read button if you want me to read it.');
        }
        clearTimeout(historyTimer);
        historyTimer = setTimeout(loadHistory, 450);
        if (data.exit) setTimeout(() => window.close(), 500);
      } catch (e) {
        const message = 'Nova server did not answer. Keep the terminal open, then try again.';
        add('nova', message, command);
        promptEl.textContent = 'Connection issue.';
        subEl.textContent = message;
        statusEl.textContent = 'Error';
      } finally {
        sendBusy = false;
        sendButton.disabled = false;
        if (fromVoice) {
          setTimeout(() => {
            voiceBusy = false;
            scheduleRecognitionStart(120);
          }, 900);
        }
      }
    }
    function setupRecognition() {
      if (!SpeechRecognition) {
        subEl.textContent = 'Browser voice needs Chrome or Edge. Use Desktop Mic instead.';
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onstart = () => {
        listening = true;
        setVoiceButtons(true);
        promptEl.textContent = 'Browser listening...';
      };
      recognition.onend = () => {
        listening = false;
        if (!micWanted) setVoiceButtons(false);
      };
      recognition.onerror = (event) => {
        listening = false;
        if (!micWanted) return;
        if (event.error === 'no-speech') {
          subEl.textContent = 'No speech heard. Mic is still ON. Click Stop Voice to turn it OFF, or speak again.';
          scheduleRecognitionStart(450);
          return;
        }
        if (event.error === 'network') {
          speechNetworkErrors += 1;
          subEl.textContent = 'Browser speech network issue. Mic mode is still ON; I will retry. Desktop Mic is usually better.';
          scheduleRecognitionStart(Math.min(4500, 900 + speechNetworkErrors * 500));
          return;
        }
        if (event.error === 'audio-capture') {
          subEl.textContent = 'No microphone found. Check Windows input device.';
          showPermissionPopup('No microphone is available to the browser. Check Windows input device or allow microphone permission. I will keep retrying until you press Stop Voice.', '');
          scheduleRecognitionStart(2200);
          return;
        }
        if (event.error === 'not-allowed') {
          subEl.textContent = 'Microphone permission blocked. Allow mic in browser address bar, or use Desktop Mic.';
          showPermissionPopup('Microphone permission is blocked. Use the browser address bar mic icon and choose Allow. I will keep the mic mode ON and retry until you press Stop Voice.', '');
          scheduleRecognitionStart(2200);
          return;
        }
        subEl.textContent = `Mic issue: ${event.error}. Click Stop Voice to turn OFF.`;
      };
      recognition.onresult = (event) => {
        const last = event.results[event.results.length - 1];
        const command = last[0].transcript;
        speechNetworkErrors = 0;
        subEl.textContent = `Heard: ${command}`;
        try { recognition.stop(); } catch (e) {}
        send(command, true);
      };
    }

    async function desktopListen() {
      claimPageOwner('voice');
      if (!assistantPowerOn || powerToggle.classList.contains('off')) {
        subEl.textContent = 'Assistant is OFF. Press ON first.';
        return;
      }
      if (desktopMicWanted || desktopMicStarting) {
        stopAllMic();
        promptEl.textContent = 'Voice stopped.';
        subEl.textContent = 'Mic is OFF. Click Start Voice once to turn ON again.';
        return;
      }
      const startId = ++desktopMicStartId;
      desktopMicStarting = true;
      stopBrowserRecognition();
      let sessionClaimed = false;
      try {
        sessionClaimed = await claimVoiceSession();
      } catch (e) {
        sessionClaimed = false;
      }
      desktopMicStarting = false;
      if (startId !== desktopMicStartId) {
        releaseVoiceSession();
        return;
      }
      if (!sessionClaimed) {
        subEl.textContent = 'Microphone session could not start. Refresh this Nova page once, then try again.';
        return;
      }
      desktopMicWanted = true;
      desktopMicErrorCount = 0;
      setVoiceButtons(true);
      promptEl.textContent = 'Desktop mic ON';
      subEl.textContent = 'Desktop mic is ON. Speak a command. Click again to turn OFF.';
      let switchedToBrowserMic = false;
      while (desktopMicWanted && assistantPowerOn) {
        if (sendBusy || voiceBusy || speechBusy || readerActive) {
          await new Promise(r => setTimeout(r, 350));
          continue;
        }
        const captureController = new AbortController();
        desktopMicAbort = captureController;
        try {
          const res = await fetch('/api/listen_once', {method: 'POST', headers: authHeaders(), signal: captureController.signal});
           const data = await res.json();
           if (!desktopMicWanted) break;
           if (!res.ok || !data.ok) throw new Error(data.error || data.message || data.text || 'Desktop mic failed');
           if (data.kind === 'inactive') {
             stopAllMic();
             promptEl.textContent = 'Mic session stopped.';
             subEl.textContent = data.message || 'Another Nova page owns the microphone. Stop it there, then press Start Voice here.';
             break;
           }
           if (!data.text) {
             if (data.kind === 'busy') {
               subEl.textContent = 'Desktop mic is already capturing. Waiting quietly...';
             } else if (data.kind === 'speech_service_error') {
               desktopMicWanted = false;
               abortDesktopMicCapture();
               releaseVoiceSession();
               if (SpeechRecognition) {
                 micWanted = true;
                 speechNetworkErrors = 0;
                 switchedToBrowserMic = true;
                 setVoiceButtons(true);
                 promptEl.textContent = 'Browser mic fallback';
                 subEl.textContent = 'Desktop mic hardware is OK, but Python speech recognition is blocked. I switched to Browser Mic. Allow browser microphone if asked.';
                 add('nova', 'Desktop mic hardware is OK, but Python speech recognition could not reach the speech service. I switched to Browser Mic fallback. If the browser asks, press Allow.');
                 scheduleRecognitionStart(650);
                 break;
               }
               subEl.textContent = 'Desktop mic hardware is OK, but Python speech recognition is blocked and this browser has no speech fallback. Use typed commands or run ALLOW_NOVA_NETWORK.cmd.';
               add('nova', data.message || 'Desktop mic speech recognition service failed. Use typed commands or run ALLOW_NOVA_NETWORK.cmd.');
               break;
             } else if (data.kind === 'no_speech') {
               subEl.textContent = 'Listening quietly... speak a command, or click Stop Voice.';
             } else {
               subEl.textContent = `${data.message || 'No speech heard.'} Mic is still ON. Click Stop Voice to turn OFF.`;
             }
             const retryMs = Math.max(350, Math.min(1800, Number(data.retry_after || 0) * 1000 || (data.kind === 'no_speech' ? 900 : 550)));
             await new Promise(r => setTimeout(r, retryMs));
             continue;
           }
          subEl.textContent = `Desktop heard: ${data.text}`;
          await send(data.text, true);
        } catch (e) {
          if (!desktopMicWanted) break;
          if (String(e.name || e).includes('Abort')) {
            await new Promise(r => setTimeout(r, 120));
            continue;
          }
          desktopMicErrorCount += 1;
          const message = String(e && e.message || e || '');
          if (/failed to fetch|load failed|networkerror/i.test(message)) {
            stopAllMic();
            promptEl.textContent = 'Mic stopped.';
            subEl.textContent = 'Nova server connection was lost. I stopped the mic so it will not repeat. Refresh the Nova page, then start voice again.';
            add('nova', 'Mic stopped because the Nova page lost connection to the local server. Refresh this page once, then press Start Voice again.');
            break;
          }
          subEl.textContent = 'Desktop mic capture had a local issue. I am retrying quietly. Click Stop Voice to turn OFF.';
          if (desktopMicErrorCount === 1) {
            // Old message kept here as a comment only:
            // "Desktop mic had an issue. If Windows shows a microphone permission popup, press Allow."
            add('nova', `Desktop mic capture issue: ${message || 'local capture failed'}. I will keep listening and retry quietly. If this repeats, say "mic status" or switch to Browser Mic.`);
          }
          await new Promise(r => setTimeout(r, Math.min(5000, 900 + desktopMicErrorCount * 350)));
          continue;
        } finally {
          if (desktopMicAbort === captureController) desktopMicAbort = null;
        }
      }
      if (!switchedToBrowserMic) stopAllMic();
    }

    unlockButton.addEventListener('click', unlockNova);
    pinInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') unlockNova();
    });
    voiceSelect.addEventListener('change', async () => {
      await fetch('/api/voice', {
        method: 'POST',
        headers: authHeaders({'Content-Type': 'application/json'}),
        body: JSON.stringify({voice: voiceSelect.value})
      });
      backendSpeak(`Voice changed to ${voiceSelect.value || 'default'}.`);
    });
    testVoice.addEventListener('click', async () => {
      if (testVoiceBusy) return;
      testVoiceBusy = true;
      testVoice.disabled = true;
      await backendSpeak('Hello Adarsh. My voice is now in slow and clear English mode.');
      setTimeout(() => {
        testVoiceBusy = false;
        testVoice.disabled = false;
      }, 2200);
    });
    readerPlay.addEventListener('click', pauseResumeReader);
    readerPrev.addEventListener('click', () => moveReader(-3));
    readerNext.addEventListener('click', () => moveReader(3));
    readerStop.addEventListener('click', () => stopReader(true));
    readerClose.addEventListener('click', () => stopReader(false));
    readerShuffle.addEventListener('click', () => {
      if (!readerAudioUrl) return;
      readerAudio.currentTime = 0;
      updateReader();
      if (!readerActive) playReaderAudio();
    });
    readerProgress.addEventListener('input', () => {
      if (!readerAudioUrl) return;
      readerAudio.currentTime = Number(readerProgress.value || 0);
      updateReader();
    });
    setupRecognition();
    refreshApiStatus();
    loadVoices();
    loadHistory();
    loadFeatureSettings();
  </script>
</body>
</html>
